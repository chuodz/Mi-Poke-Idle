<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia MMO - Stable Canvas</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 14px; margin: 2px 0; }
        .game-panel {
            max-width: 390px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #ffcb05;
            border-radius: 8px;
            padding: 4px;
            box-sizing: border-box;
        }
        p { margin: 2px 0; font-size: 10px; }
        .bar-bg { width: 100%; background: #444; height: 5px; border-radius: 4px; overflow: hidden; margin: 1px 0; }
        .bar-fill { height: 100%; background: #3b4cca; width: 0%; transition: width 0.3s; }
        .hp-fill { background: #28a745; }
        
        #game-container { 
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffcb05; 
            border-radius: 6px; 
            overflow: hidden; 
            margin: 2px auto;
            width: 360px;
            height: 170px;
            background: #38863b;
        }

        .team-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 2px;
            margin: 2px 0;
        }
        .poke-slot {
            width: 31%;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 2px;
            cursor: pointer;
            font-size: 9px;
        }
        .poke-slot.active { border-color: #ffcb05; background: #443c15; }
        .poke-slot img { width: 30px; height: 30px; display: block; margin: 0 auto; }

        .dpad-container {
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-row { display: flex; }
        .dpad-btn, .action-btn, .menu-btn {
            background: #e3350d;
            color: white;
            font-weight: bold;
            border: 2px solid #ffcb05;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .dpad-btn { width: 34px; height: 34px; font-size: 12px; margin: 1px; }
        .action-btn { width: 31%; padding: 3px; margin-top: 2px; font-size: 9px; display: inline-block; }
        .menu-btn { width: 23%; padding: 4px; margin: 1px; font-size: 8px; background: #3b4cca; display: inline-block; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #3b4cca; }
        .btn-orange { background: #d97706; }
        .btn-shop { background: #d97706; }

        .modal-window {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 330px;
            max-height: 82vh;
            background: #1a1a1a;
            border: 3px solid #ffcb05;
            border-radius: 8px;
            padding: 8px;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0,0,0,0.9);
            text-align: left;
            overflow-y: auto;
            font-size: 10px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ffcb05;
            padding-bottom: 3px;
            margin-bottom: 4px;
            color: #ffcb05;
            font-weight: bold;
        }
        .close-btn { background: #e3350d; color: #fff; border: none; border-radius: 4px; cursor: pointer; padding: 2px 5px; }

        .box-section {
            background: #2a2a2a;
            border: 1px solid #ffcb05;
            border-radius: 6px;
            padding: 3px;
            margin-top: 2px;
            font-size: 9px;
            text-align: left;
        }
        .shop-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 3px;
            margin: 2px 0;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .buy-action-btn { padding: 2px 5px; font-size: 8px; background: #ffcb05; color: #000; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; }
    </style>
</head>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia 2D MMORPG Online - Expanded</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 15px; margin: 3px 0; }
        .game-panel {
            max-width: 390px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #ffcb05;
            border-radius: 8px;
            padding: 5px;
            box-sizing: border-box;
        }
        p { margin: 2px 0; font-size: 11px; }
        .bar-bg { width: 100%; background: #444; height: 6px; border-radius: 4px; overflow: hidden; margin: 2px 0; }
        .bar-fill { height: 100%; background: #3b4cca; width: 0%; transition: width 0.3s; }
        .hp-fill { background: #28a745; }
        
        #game-container { 
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffcb05; 
            border-radius: 6px; 
            overflow: hidden; 
            margin: 3px auto;
            width: 360px;
            height: 180px;
            background: #2d4d2d;
        }

        .team-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 3px;
            margin: 3px 0;
        }
        .poke-slot {
            width: 31%;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 2px;
            cursor: pointer;
            font-size: 10px;
        }
        .poke-slot.active { border-color: #ffcb05; background: #443c15; }
        .poke-slot img { width: 32px; height: 32px; display: block; margin: 0 auto; }

        .dpad-container {
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-row { display: flex; }
        .dpad-btn, .action-btn {
            background: #e3350d;
            color: white;
            font-weight: bold;
            border: 2px solid #ffcb05;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .dpad-btn { width: 36px; height: 36px; font-size: 13px; margin: 1px; }
        .action-btn { width: 31%; padding: 4px; margin-top: 2px; font-size: 10px; display: inline-block; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #3b4cca; }
        .btn-orange { background: #d97706; }

        .box-section {
            background: #2a2a2a;
            border: 1px solid #ffcb05;
            border-radius: 6px;
            padding: 4px;
            margin-top: 3px;
            font-size: 10px;
            text-align: left;
            max-height: 95px;
            overflow-y: auto;
        }
        .shop-btn { padding: 2px 5px; font-size: 9px; background: #ffcb05; color: #000; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <div class="game-panel">
        <h1>PokeTibia MMORPG Online</h1>
        <p>🔴 Balls: <b id="pokeballs">5</b> | 💰 $<span id="coins">40</span> | 🟢 Online: <span id="online-players">1</span> | <span id="depot-status" style="color:#28a745;">Depot: Seguro</span></p>

        <!-- EQUIPO ACTIVO -->
        <div id="team-container" class="team-bar"></div>
        
        <!-- CONTENEDOR DEL JUEGO -->
        <div id="game-container"></div>

        <p id="battle-log">¡Explora los caminos y caza en el césped alto!</p>
        
        <!-- BARRA DE ACCIONES -->
        <div>
            <button class="action-btn btn-green" onclick="castSpell('fast')">⚡ Ataque Rápido</button>
            <button class="action-btn btn-orange" onclick="castSpell('heavy')">🔥 Rayo Fuerte</button>
            <button class="action-btn btn-blue" onclick="tryCatch()">🔴 Pokéball</button>
        </div>
        <button class="action-btn btn-blue" style="width:100%; margin-top:2px;" onclick="changeRoute()">🗺️ Cambiar Mapa (<span id="zone-name">Ruta 1 - Pradera</span>)</button>

        <!-- D-PAD TÁCTIL -->
        <div class="dpad-container">
            <button class="dpad-btn" id="btn-up">⬆️</button>
            <div class="dpad-row">
                <button class="dpad-btn" id="btn-left">⬅️</button>
                <button class="dpad-btn" id="btn-down">⬇️</button>
                <button class="dpad-btn" id="btn-right">➡️</button>

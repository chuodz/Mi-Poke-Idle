<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia Idle - Edición Completa</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 400px; margin: 0 auto; }
        .card { background: #1e1e1e; border: 2px solid #ffcb05; padding: 15px; border-radius: 10px; margin: 10px 0; box-sizing: border-box; }
        button { padding: 10px; background: #e3350d; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; font-size: 15px; width: 100%; margin-top: 8px; }
        button:hover { background: #b32305; }
        .btn-catch { background: #3b4cca; }
        .btn-catch:hover { background: #2a3594; }
        .hp-bar { width: 100%; background: #444; height: 18px; border-radius: 5px; overflow: hidden; margin: 8px 0; }
        .hp-fill { height: 100%; background: #4caf50; width: 100%; transition: width 0.2s; }
        h1 { color: #ffcb05; font-size: 22px; margin: 10px 0; }
        h3 { margin: 5px 0 10px 0; font-size: 16px; }
        p { margin: 6px 0; font-size: 14px; }
        .team-list { text-align: left; font-size: 13px; max-height: 100px; overflow-y: auto; background: #2a2a2a; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>PokeTibia Idle World</h1>

    <!-- COMBATE -->
    <div class="card">
        <h3 id="enemy-name">Pikachu Salvaje (Lv. 1)</h3>
        <div class="hp-bar"><div id="enemy-hp" class="hp-fill"></div></div>
        <p>HP: <span id="hp-text">100/100</span></p>
        <button onclick="attackEnemy()">¡Atacar Manual!</button>
        <button class="btn-catch" onclick="tryCatch()">Lanzar Pokéball (Req: 10 Pokéballs)</button>
    </div>

    <!-- PROGRESO Y TIENDA -->
    <div class="card">
        <h3>Tu Progreso</h3>
        <p>PokéDollars: $<span id="coins">0</span></p>
        <p>Pokéballs: <span id="pokeballs">5</span></p>
        <p>Daño Automático (DPS): <span id="dps">5</span> /seg</p>
        <button onclick="buyUpgrade()">Mejorar Daño ($<span id="upgrade-cost">10</span>)</button>
        <button onclick="buyPokeball()">Comprar Pokéball ($15)</button>
    </div>

    <!-- EQUIPO CAPTURADO -->
    <div class="card">
        <h3>Tu Equipo Capturado (<span id="team-count">0</span>)</h3>
        <div id="team-list" class="team-list">Aún no has atrapado ningún Pokémon.</div>
    </div>
</div>

    <script>
        // LISTA DE POKÉMON SALVAJES POSIBLES
        const pokemonPool = [
            { name: "Pikachu", baseHp: 100, reward: 5 },
            { name: "Rattata", baseHp: 60, reward: 3 },
            { name: "Pidgey", baseHp: 80, reward: 4 },
            { name: "Caterpie", baseHp: 50, reward: 2 },
            { name: "Bulbasaur", baseHp: 130, reward: 8 },
            { name: "Charmander", baseHp: 130, reward: 8 },
            { name: "Squirtle", baseHp: 130, reward: 8 }
        ];

        let player = {
            coins: 0,
            pokeballs: 5,
            dps: 5,
            upgradeCost: 10,
            team: []
        };

        let currentLevel = 1;

        let enemy = {
            name: "Pikachu",
            level: 1,
            maxHp: 100,
            hp: 100,
            reward: 5
        };

        function spawnNewEnemy() {
            let randomPoke = pokemonPool[Math.floor(Math.random() * pokemonPool.length)];
            currentLevel = Math.floor(Math.random() * 3) + currentLevel; // Escala poco a poco
            enemy.name = randomPoke.name;
            enemy.level = Math.max(1, Math.floor(currentLevel));
            enemy.maxHp = Math.floor(randomPoke.baseHp * (1 + (enemy.level * 0.2)));
            enemy.hp = enemy.maxHp;
            enemy.reward = Math.floor(randomPoke.reward * (1 + (enemy.level * 0.15)));
        }

        function updateUI() {
            document.getElementById('enemy-name').innerText = `${enemy.name} (Lv. ${enemy.level})`;
            document.getElementById('hp-text').innerText = `${Math.max(0, enemy.hp)} / ${enemy.maxHp}`;
            let hpPercent = (enemy.hp / enemy.maxHp) * 100;
            document.getElementById('enemy-hp').style.width = `${Math.max(0, hpPercent)}%`;
            
            document.getElementById('coins').innerText = player.coins;
            document.getElementById('pokeballs').innerText = player.pokeballs;
            document.getElementById('dps').innerText = player.dps;
            document.getElementById('upgrade-cost').innerText = player.upgradeCost;
            document.getElementById('team-count').innerText = player.team.length;

            let teamContainer = document.getElementById('team-list');
            if (player.team.length === 0) {
                teamContainer.innerHTML = "Aún no has atrapado ningún Pokémon.";
            } else {
                teamContainer.innerHTML = player.team.map(p => `• ${p.name} (Lv. ${p.level})`).join('<br>');
            }
        }

        function attackEnemy() {
            enemy.hp -= 10;
            if (enemy.hp <= 0) {
                defeatEnemy();
            }
            updateUI();
        }

        function defeatEnemy() {
            player.coins += enemy.reward;
            // Probabilidad de encontrar una Pokéball al derrotar enemigos
            if (Math.random() < 0.4) {
                player.pokeballs += 1;
            }
            spawnNewEnemy();
            saveGame();
        }

        function tryCatch() {
            if (player.pokeballs >= 10) {
                player.pokeballs -= 10;
                // Probabilidad de captura basada en la vida restante del enemigo (a menor vida, más fácil)
                let hpPercent = enemy.hp / enemy.maxHp;
                let catchChance = 0.4 + (0.5 * (1 - hpPercent)); // Hasta 90% si está muy débil
                
                if (Math.random() < catchChance) {
                    alert(`¡Felicidades! Atrapaste a ${enemy.name} (Lv. ${enemy.level})`);
                    player.team.push({ name: enemy.name, level: enemy.level });
                    spawnNewEnemy();
                } else {
                    alert(`¡Oh no! ${enemy.name} escapó de la Pokéball.`);
                }
                updateUI();
                saveGame();
            } else {
                alert("¡Necesitas al menos 10 Pokéballs para intentar capturar!");
            }
        }

        function buyUpgrade() {
            if (player.coins >= player.upgradeCost) {
                player.coins -= player.upgradeCost;
                player.dps += 3;
                player.upgradeCost = Math.floor(player.upgradeCost * 1.4);
                updateUI();
            } else {
                alert("¡No tienes suficientes PokéDollars!");
            }
        }

        function buyPokeball() {
            if (player.coins >= 15) {
                player.coins -= 15;
                player.pokeballs += 1;
                updateUI();
            } else {
                alert("¡Necesitas $15 PokéDollars para comprar una Pokéball!");
            }
        }

        // Bucle automático de combate Idle
        setInterval(() => {
            if (enemy.hp > 0) {
                enemy.hp -= player.dps / 2;
                if (enemy.hp <= 0) {
                    defeatEnemy();
                }
                updateUI();
            }
        }, 500);

        function saveGame() {
            localStorage.setItem('pokeTibiaSave', JSON.stringify({ player, enemy, currentLevel }));
        }

        function loadGame() {
            let saved = localStorage.getItem('pokeTibiaSave');
            if (saved) {
                let data = JSON.parse(saved);
                player = data.player;
                enemy = data.enemy || enemy;
                currentLevel = data.currentLevel || 1;
            } else {
                spawnNewEnemy();
            }
            updateUI();
        }

        loadGame();
    </script>
</body>
</html>

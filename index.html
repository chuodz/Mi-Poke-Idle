<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia 2D MMORPG Online - Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 15px; margin: 3px 0; }
        .game-panel {
            max-width: 390px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #ffcb05;
            border-radius: 8px;
            padding: 5px;
            box-sizing: border-box;
        }
        p { margin: 2px 0; font-size: 11px; }
        .bar-bg { width: 100%; background: #444; height: 6px; border-radius: 4px; overflow: hidden; margin: 2px 0; }
        .bar-fill { height: 100%; background: #3b4cca; width: 0%; transition: width 0.3s; }
        .hp-fill { background: #28a745; }
        
        #game-container { 
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffcb05; 
            border-radius: 6px; 
            overflow: hidden; 
            margin: 3px auto;
            width: 360px;
            height: 180px;
            background: #2d4d2d;
        }

        .team-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 3px;
            margin: 3px 0;
        }
        .poke-slot {
            width: 31%;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 2px;
            cursor: pointer;
            font-size: 10px;
        }
        .poke-slot.active { border-color: #ffcb05; background: #443c15; }
        .poke-slot img { width: 32px; height: 32px; display: block; margin: 0 auto; }

        .dpad-container {
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-row { display: flex; }
        .dpad-btn, .action-btn {
            background: #e3350d;
            color: white;
            font-weight: bold;
            border: 2px solid #ffcb05;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .dpad-btn { width: 36px; height: 36px; font-size: 13px; margin: 1px; }
        .action-btn { width: 31%; padding: 4px; margin-top: 2px; font-size: 10px; display: inline-block; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #3b4cca; }
        .btn-orange { background: #d97706; }

        .box-section {
            background: #2a2a2a;
            border: 1px solid #ffcb05;
            border-radius: 6px;
            padding: 4px;
            margin-top: 3px;
            font-size: 10px;
            text-align: left;
            max-height: 95px;
            overflow-y: auto;
        }
        .shop-btn { padding: 2px 5px; font-size: 9px; background: #ffcb05; color: #000; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <div class="game-panel">
        <h1>PokeTibia MMORPG Online</h1>
        <p>🔴 Balls: <b id="pokeballs">5</b> | 💰 $<span id="coins">40</span> | 🟢 Online: <span id="online-players">1</span> | <span id="depot-status" style="color:#28a745;">Depot: Seguro</span></p>

        <!-- EQUIPO ACTIVO -->
        <div id="team-container" class="team-bar"></div>
        
        <!-- CONTENEDOR DEL JUEGO -->
        <div id="game-container"></div>

        <p id="battle-log">¡Explora los caminos y caza en el césped alto!</p>
        
        <!-- BARRA DE ACCIONES -->
        <div>
            <button class="action-btn btn-green" onclick="castSpell('fast')">⚡ Ataque Rápido</button>
            <button class="action-btn btn-orange" onclick="castSpell('heavy')">🔥 Rayo Fuerte</button>
            <button class="action-btn btn-blue" onclick="tryCatch()">🔴 Pokéball</button>
        </div>
        <button class="action-btn btn-blue" style="width:100%; margin-top:2px;" onclick="changeRoute()">🗺️ Cambiar Mapa (<span id="zone-name">Ruta 1 - Pradera</span>)</button>

        <!-- D-PAD TÁCTIL -->
        <div class="dpad-container">
            <button class="dpad-btn" id="btn-up">⬆️</button>
            <div class="dpad-row">
                <button class="dpad-btn" id="btn-left">⬅️</button>
                <button class="dpad-btn" id="btn-down">⬇️</button>
                <button class="dpad-btn" id="btn-right">➡️</button>
            </div>
        </div>

        <!-- MISIONES PROGRESIVAS -->
        <div class="box-section">
            <b>📜 Misión Activa:</b> <span id="quest-text">Cargando misión...</span>
        </div>

        <!-- POKÉDEX Y COLECCIÓN -->
        <div class="box-section">
            <b>📖 Pokédex & Caja de Colección:</b>
            <div id="pokedex-list" style="margin-top:2px;">Cargando...</div>
        </div>

        <!-- TIENDA E INVENTARIO -->
        <div class="box-section">
            <b>🎒 Loot / Ítems:</b> <span id="inventory-list">Vacío</span><br>
            <hr style="border-color:#444; margin:2px 0;">
            <span>🏥 Curar Centro Pokémon ($15)</span><button class="shop-btn" onclick="healTeam()">Curar</button><br>
            <div style="margin-top:2px;"><span>🔴 Comprar Pokéball ($10)</span><button class="shop-btn" onclick="buyBall()">Comprar</button></div>
            <div style="margin-top:2px;"><span>💰 Vender Todo el Loot</span><button class="shop-btn" onclick="sellLoot()">Vender</button></div>
        </div>
    </div>

    <script>
        // Mapeo oficial de nombres para la Pokédex
        const pokemonNames = {
            1: "Bulbasaur", 4: "Charmander", 7: "Squirtle", 10: "Caterpie", 16: "Pidgey",
            19: "Rattata", 25: "Pikachu", 26: "Raichu", 39: "Jigglypuff", 52: "Meowth",
            54: "Psyduck", 60: "Poliwag", 63: "Abra", 66: "Machop", 74: "Geodude",
            92: "Gastly", 95: "Onix", 121: "Starmie", 129: "Magikarp", 133: "Eevee",
            143: "Snorlax", 150: "Mewtwo"
        };

        function getPokeName(id) {
            return pokemonNames[id] || `Pokémon #${id}`;
        }

        let savedData = localStorage.getItem('poketibia_save_v5');
        let playerData = savedData ? JSON.parse(savedData) : {
            coins: 40,
            pokeballs: 5,
            routeIndex: 0,
            inventory: {},
            team: [
                { id: 25, name: "Pikachu", level: 5, exp: 0, maxExp: 100, hp: 60, maxHp: 60, atk: 25 }
            ],
            activePokeIndex: 0,
            pokedex: {},
            box: [],
            questCount: 0,
            questLevel: 0
        };

        // Corregir nombres guardados si tenían errores previos
        playerData.team.forEach(p => { p.name = getPokeName(p.id); });

        const questGoals = [
            { target: 3, rewardCoins: 30, rewardBalls: 2, desc: "Derrota 3 Pokémon" },
            { target: 10, rewardCoins: 80, rewardBalls: 5, desc: "Derrota 10 Pokémon" },
            { target: 25, rewardCoins: 200, rewardBalls: 10, desc: "Derrota 25 Pokémon" },
            { target: 50, rewardCoins: 450, rewardBalls: 20, desc: "Derrota 50 Pokémon" },
            { target: 100, rewardCoins: 1000, rewardBalls: 40, desc: "¡Gran Caza! Derrota 100 Pokémon" }
        ];

        function saveGame() {
            localStorage.setItem('poketibia_save_v5', JSON.stringify(playerData));
        }

        const routes = [
            { name: "Ruta 1 - Pradera", bg: 0x2e5a1c, treeColor: 0x143308, grassColor: 0x3d7a25, pathColor: 0x8b5a2b },
            { name: "Bosque Verde", bg: 0x183b0d, treeColor: 0x0a1a05, grassColor: 0x245413, pathColor: 0x5c3a1e },
            { name: "Cueva Oscura", bg: 0x222222, treeColor: 0x111111, grassColor: 0x444444, pathColor: 0x666666 }
        ];

        const popularIds = [1, 4, 7, 10, 16, 19, 25, 39, 52, 54, 60, 63, 66, 74, 92, 121, 133];

        function getRandomPokemon() {
            let randomId = popularIds[Math.floor(Math.random() * popularIds.length)];
            let enemyLevel = Math.floor(Math.random() * 8) + 1;
            let calculatedHp = Number(35 + (enemyLevel * 8));
            return {
                id: randomId,
                name: getPokeName(randomId),
                level: enemyLevel,
                hp: calculatedHp,
                currentHp: calculatedHp,
                maxHp: calculatedHp,
                atk: Number(12 + (enemyLevel * 3)),
                loot: 'Objeto Raro',
                price: 15
            };
        }

        let activeEnemy = null;
        let enemySprite = null;
        let enemyHpBar = null;
        let lastAttackTime = 0;
        let broadcastChannel = null;
        let remotePlayers = {};

        const config = {
            type: Phaser.AUTO,
            width: 360,
            height: 180,
            parent: 'game-container',
            backgroundColor: routes[0].bg,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let sceneContext;
        let trainer;
        let petPokemon;
        let cursors;
        let moveState = { left: false, right: false, up: false, down: false };

        function preload() {
            popularIds.forEach(id => {
                this.load.image(`poke_${id}`, `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`);
            });
            this.load.image('poke_26', 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/26.png');
        }

        function create() {
            sceneContext = this;

            createTrainerTexture(this);
            drawMap(this, routes[playerData.routeIndex || 0]);

            trainer = this.physics.add.sprite(90, 95, 'trainer_gfx');
            trainer.setCollideWorldBounds(true);

            let activePoke = playerData.team[playerData.activePokeIndex];
            petPokemon = this.physics.add.sprite(65, 95, `poke_${activePoke.id}`);
            petPokemon.setScale(0.85);

            cursors = this.input.keyboard.createCursorKeys();

            setupDpadButton('btn-left', 'left');
            setupDpadButton('btn-right', 'right');
            setupDpadButton('btn-up', 'up');
            setupDpadButton('btn-down', 'down');

            setupOnlineServer();
            spawnEnemyInMap(this);
            updateUI();
        }

        function createTrainerTexture(scene) {
            if (scene.textures.exists('trainer_gfx')) return;
            let g = scene.add.graphics();
            g.fillStyle(0x3366cc, 1); g.fillRect(6, 12, 12, 12);
            g.fillStyle(0x333333, 1); g.fillRect(7, 24, 10, 8);
            g.fillStyle(0xffcc99, 1); g.fillCircle(12, 8, 6);
            g.fillStyle(0xcc0000, 1); g.fillRect(4, 2, 16, 4);
            g.generateTexture('trainer_gfx', 24, 32);
            g.destroy();
        }

        function drawMap(scene, route) {
            let graphics = scene.add.graphics();
            graphics.fillStyle(route.pathColor, 1);
            graphics.fillRect(0, 75, 360, 30);
            graphics.fillRect(165, 0, 30, 180);

            graphics.fillStyle(route.grassColor, 1);
            graphics.fillRect(25, 20, 80, 40);
            graphics.fillRect(240, 120, 80, 40);

            graphics.fillStyle(0xcc0000, 1);
            graphics.fillRect(290, 15, 50, 30);
            graphics.fillStyle(0xffffff, 1);
            graphics.fillRect(308, 22, 14, 14);

            graphics.fillStyle(route.treeColor, 1);
            for(let x = 12; x <= 348; x += 24) {
                graphics.fillCircle(x, 10, 14);
                graphics.fillCircle(x, 170, 14);
            }
            for(let y = 12; y <= 170; y += 24) {
                graphics.fillCircle(10, y, 14);
                graphics.fillCircle(350, y, 14);
            }
        }

        function spawnEnemyInMap(scene) {
            if (enemySprite) enemySprite.destroy();
            if (enemyHpBar) enemyHpBar.destroy();

            activeEnemy = getRandomPokemon();
            let randomX = Math.floor(Math.random() * 90) + 210;
            let randomY = Math.floor(Math.random() * 60) + 55;

            if (!playerData.pokedex[activeEnemy.id]) {
                playerData.pokedex[activeEnemy.id] = { name: activeEnemy.name, id: activeEnemy.id, seen: 1, caught: 0 };
            } else {
                playerData.pokedex[activeEnemy.id].seen++;
            }

            enemySprite = scene.physics.add.sprite(randomX, randomY, `poke_${activeEnemy.id}`);
            enemySprite.setScale(0.85);

            enemyHpBar = scene.add.graphics();
            updateEnemyHpBar();

            document.getElementById('battle-log').innerText = `⚔️ ¡Un ${activeEnemy.name} salvaje (Lv.${activeEnemy.level}) apareció!`;
            updateUI();
            saveGame();
        }

        function updateEnemyHpBar() {
            if (!enemyHpBar || !enemySprite || !activeEnemy) return;
            enemyHpBar.clear();
            enemyHpBar.fillStyle(0x000000, 0.7);
            enemyHpBar.fillRect(enemySprite.x - 18, enemySprite.y - 24, 36, 5);

            let pct = Math.max(0, Number(activeEnemy.currentHp) / Number(activeEnemy.maxHp));
            enemyHpBar.fillStyle(pct > 0.4 ? 0x00ff00 : 0xff0000, 1);
            enemyHpBar.fillRect(enemySprite.x - 18, enemySprite.y - 24, 36 * pct, 5);
        }

        function setupDpadButton(id, direction) {
            let btn = document.getElementById(id);
            if(!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[direction] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[direction] = false; });
            btn.addEventListener('mousedown', () => { moveState[direction] = true; });
            btn.addEventListener('mouseup', () => { moveState[direction] = false; });
        }

        const myId = 'player_' + Math.random().toString(36).substr(2, 6);
        function setupOnlineServer() {
            if (window.BroadcastChannel) {
                broadcastChannel = new BroadcastChannel('poketibia_mmo_channel');
                broadcastChannel.onmessage = (event) => {
                    let data = event.data;
                    if (data.id === myId) return;

                    if (data.type === 'move') {
                        if (!remotePlayers[data.id] && sceneContext) {
                            remotePlayers[data.id] = sceneContext.physics.add.sprite(data.x, data.y, 'trainer_gfx');
                        } else if (remotePlayers[data.id]) {
                            remotePlayers[data.id].x = data.x;
                            remotePlayers[data.id].y = data.y;
                        }
                    } else if (data.type === 'leave') {
                        if (remotePlayers[data.id]) {
                            remotePlayers[data.id].destroy();
                            delete remotePlayers[data.id];
                        }
                    }
                    updateOnlineCount();
                };
            }
        }

        function updateOnlineCount() {
            let count = Object.keys(remotePlayers).length + 1;
            document.getElementById('online-players').innerText = count;
        }

        function update() {
            if (!trainer) return;
            trainer.setVelocity(0);
            let speed = 125;

            if (cursors.left.isDown || moveState.left) { trainer.setVelocityX(-speed); }
            else if (cursors.right.isDown || moveState.right) { trainer.setVelocityX(speed); }

            if (cursors.up.isDown || moveState.up) { trainer.setVelocityY(-speed); }
            else if (cursors.down.isDown || moveState.down) { trainer.setVelocityY(speed); }

            if (petPokemon && trainer) {
                petPokemon.x = Phaser.Math.Linear(petPokemon.x, trainer.x - 22, 0.1);
                petPokemon.y = Phaser.Math.Linear(petPokemon.y, trainer.y, 0.1);
            }

            if (broadcastChannel && trainer && trainer.body && (trainer.body.velocity.x !== 0 || trainer.body.velocity.y !== 0)) {
                broadcastChannel.postMessage({ id: myId, type: 'move', x: trainer.x, y: trainer.y });
            }

            if (trainer.x > 260 && trainer.y < 50) {
                document.getElementById('depot-status').innerText = "Depot: ¡Seguro!";
            } else {
                document.getElementById('depot-status').innerText = "Depot: Explorando";
            }

            if (enemySprite && activeEnemy) {
                updateEnemyHpBar();
            }
        }

        // Proyectil preciso y directo desde el Pokémon hasta el objetivo
        function spawnSpellEffect(type) {
            if (!sceneContext || !petPokemon || !enemySprite) return;
            let color = type === 'heavy' ? 0xff3300 : 0xffea00;
            let size = type === 'heavy' ? 8 : 5;
            
            let startX = petPokemon.x;
            let startY = petPokemon.y;
            let targetX = enemySprite.x;
            let targetY = enemySprite.y;

            let projectile = sceneContext.add.circle(startX, startY, size, color, 1);
            sceneContext.tweens.add({
                targets: projectile,
                x: targetX,
                y: targetY,
                duration: 200,
                onComplete: () => {
                    projectile.destroy();
                    let flash = sceneContext.add.circle(targetX, targetY, 18, 0xffffff, 0.9);
                    sceneContext.tweens.add({
                        targets: flash,
                        scale: 2.2,
                        alpha: 0,
                        duration: 150,
                        onComplete: () => flash.destroy()
                    });
                }
            });
        }

        function castSpell(type) {
            let now = Date.now();
            if (now - lastAttackTime < 700) {
                document.getElementById('battle-log').innerText = `⏳ ¡Enfriamiento activo!`;
                return;
            }
            lastAttackTime = now;
            spawnSpellEffect(type);
            triggerAttack(type);
        }

        function triggerAttack(type = 'fast') {
            if (!activeEnemy || !sceneContext) return;
            let activePoke = playerData.team[playerData.activePokeIndex];

            if (activePoke.hp <= 0) {
                alert(`¡${activePoke.name} está debilitado! Ve al Centro Pokémon.`);
                return;
            }

            let damage = Math.floor(type === 'heavy' ? activePoke.atk * 1.8 : activePoke.atk);
            
            if (isNaN(activeEnemy.currentHp)) {
                activeEnemy.currentHp = Number(activeEnemy.maxHp);
            }

            activeEnemy.currentHp -= damage;
            activePoke.hp = Math.max(0, activePoke.hp - 6);
            updateEnemyHpBar();

            if (activeEnemy.currentHp <= 0) {
                playerData.inventory[activeEnemy.loot] = (playerData.inventory[activeEnemy.loot] || 0) + 1;
                playerData.coins += 15;

                playerData.questCount++;
                let currentGoal = questGoals[playerData.questLevel] || questGoals[questGoals.length - 1];
                
                if (playerData.questCount >= currentGoal.target) {
                    playerData.coins += currentGoal.rewardCoins;
                    playerData.pokeballs += currentGoal.rewardBalls;
                    alert(`📜 ¡Misión Cumplida (${currentGoal.desc})!\nRecompensa: +$${currentGoal.rewardCoins} y +${currentGoal.rewardBalls} Pokéballs.`);
                    
                    playerData.questCount = 0;
                    if (playerData.questLevel < questGoals.length - 1) {
                        playerData.questLevel++;
                    }
                }

                activePoke.exp += 50;
                if (activePoke.exp >= activePoke.maxExp) {
                    activePoke.exp -= activePoke.maxExp;
                    activePoke.level++;
                    activePoke.atk += 6;
                    activePoke.maxHp += 15;
                    activePoke.hp = activePoke.maxHp;
                    alert(`🎉 ¡Tu ${activePoke.name} subió al Nivel ${activePoke.level}!`);
                }

                document.getElementById('battle-log').innerText = `💥 ¡Derrotaste a ${activeEnemy.name}!`;
                saveGame();
                spawnEnemyInMap(sceneContext);
            } else {
                document.getElementById('battle-log').innerText = `⚡ ${activePoke.name} usó ataque. HP: ${activeEnemy.currentHp}/${activeEnemy.maxHp}`;
            }
            updateUI();
        }

        function tryCatch() {
            if (!activeEnemy) return;
            if (playerData.pokeballs <= 0) {
                alert("¡No tienes Pokéballs! Compra más en la tienda.");
                return;
            }

            playerData.pokeballs--;
            let hpRatio = activeEnemy.currentHp / activeEnemy.maxHp;

            if (hpRatio < 0.6 || Math.random() < 0.5) {
                alert(`🎉 ¡Atrapaste a ${activeEnemy.name}!`);
                if (playerData.pokedex[activeEnemy.id]) {
                    playerData.pokedex[activeEnemy.id].caught++;
                }

                let newPoke = {
                    id: activeEnemy.id,
                    name: activeEnemy.name,
                    level: activeEnemy.level,
                    exp: 0,
                    maxExp: 80,
                    hp: activeEnemy.maxHp,
                    maxHp: activeEnemy.maxHp,
                    atk: activeEnemy.atk
                };

                if (playerData.team.length < 3) {
                    playerData.team.push(newPoke);
                } else {
                    playerData.box.push(newPoke);
                    alert(`📦 Equipo lleno. Enviado a la Caja de Colección.`);
                }
                saveGame();
                spawnEnemyInMap(sceneContext);
            } else {
                alert(`❌ ¡${activeEnemy.name} escapó!`);
            }
            updateUI();
        }

        function selectPoke(index) {
            if (playerData.team[index].hp <= 0) {
                alert("¡Este Pokémon está debilitado!");
                return;
            }
            playerData.activePokeIndex = index;
            let activePoke = playerData.team[index];
            if (petPokemon && sceneContext) {
                petPokemon.setTexture(`poke_${activePoke.id}`);
            }
            updateUI();
            saveGame();
        }

        function sendToTeam(boxIndex) {
            if (playerData.team.length >= 3) {
                alert("Tu equipo activo está lleno (máximo 3).");
                return;
            }
            let poke = playerData.box.splice(boxIndex, 1)[0];
            playerData.team.push(poke);
            updateUI();
            saveGame();
            alert(`¡${poke.name} se unió al equipo activo!`);
        }

        function healTeam() {
            if (playerData.coins >= 15) {
                playerData.coins -= 15;
                playerData.team.forEach(p => { p.hp = p.maxHp; });
                updateUI();
                saveGame();
                alert("🏥 ¡Centro Pokémon: Equipo curado por completo!");
            } else {
                alert("¡Faltan PokéDollars ($15)!");
            }
        }

        function buyBall() {
            if (playerData.coins >= 10) {
                playerData.coins -= 10;
                playerData.pokeballs++;
                updateUI();
                saveGame();
            } else {
                alert("¡No tienes suficientes PokéDollars ($10)!");
            }
        }

        function sellLoot() {
            let total = 0;
            for (let item in playerData.inventory) {
                total += playerData.inventory[item] * 12;
            }
            if (total > 0) {
                playerData.coins += total;
                playerData.inventory = {};
                updateUI();
                saveGame();
                alert(`💰 ¡Vendiste todo tu loot por $${total} PokéDollars!`);
            } else {
                alert("No tienes objetos para vender.");
            }
        }

        function changeRoute() {
            playerData.routeIndex = ((playerData.routeIndex || 0) + 1) % routes.length;
            let r = routes[playerData.routeIndex];
            document.getElementById('zone-name').innerText = r.name;
            saveGame();
            if (sceneContext) {
                sceneContext.cameras.main.setBackgroundColor(r.bg);
                sceneContext.children.removeAll();
                
                createTrainerTexture(sceneContext);
                drawMap(sceneContext, r);

                trainer = sceneContext.physics.add.sprite(90, 95, 'trainer_gfx');
                trainer.setCollideWorldBounds(true);

                let activePoke = playerData.team[playerData.activePokeIndex];
                petPokemon = sceneContext.physics.add.sprite(65, 95, `poke_${activePoke.id}`);
                petPokemon.setScale(0.85);

                spawnEnemyInMap(sceneContext);
            }
        }

        function updateUI() {
            document.getElementById('coins').innerText = playerData.coins;
            document.getElementById('pokeballs').innerText = playerData.pokeballs;
            
            let currentGoal = questGoals[playerData.questLevel] || questGoals[questGoals.length - 1];
            document.getElementById('quest-text').innerText = `${currentGoal.desc} (${playerData.questCount}/${currentGoal.target})`;

            let teamHTML = "";
            playerData.team.forEach((poke, idx) => {
                let active = idx === playerData.activePokeIndex ? "active" : "";
                let hpPct = (poke.hp / poke.maxHp) * 100;
                teamHTML += `
                    <div class="poke-slot ${active}" onclick="selectPoke(${idx})">
                        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${poke.id}.png">
                        <b>${poke.name}</b> (Lv.${poke.level})<br>
                        <div class="bar-bg"><div class="bar-fill hp-fill" style="width:${hpPct}%"></div></div>
                        <span style="font-size:9px;">${poke.hp}/${poke.maxHp} HP</span>
                    </div>
                `;
            });
            document.getElementById('team-container').innerHTML = teamHTML;

            let pokedexHTML = "<i>Pokédex Activa</i><br>";
            for (let id in playerData.pokedex) {
                let entry = playerData.pokedex[id];
                pokedexHTML += `<div>✔️ #${String(entry.id).padStart(3, '0')} <b>${getPokeName(entry.id)}</b> | Visto: ${entry.seen} | Atrapado: ${entry.caught}</div>`;
            }

            if (playerData.box && playerData.box.length > 0) {
                pokedexHTML += `<hr style="border-color:#444; margin:2px 0;"><b>📦 Caja de Colección:</b><br>`;
                playerData.box.forEach((bPoke, bIdx) => {
                    pokedexHTML += `<button onclick="sendToTeam(${bIdx})" style="margin:2px; background:#3b4cca; color:#fff; border:none; padding:2px 5px; border-radius:3px; cursor:pointer;">Sacar a ${getPokeName(bPoke.id)}</button> `;
                });
            }
            document.getElementById('pokedex-list').innerHTML = pokedexHTML;

            let inv = [];
            for (let i in playerData.inventory) {
                if(playerData.inventory[i] > 0) inv.push(`${i} x${playerData.inventory[i]}`);
            }
            document.getElementById('inventory-list').innerHTML = inv.length ? inv.join(', ') : "Vacío";
        }

        updateUI();
    </script>
</body>
</html>

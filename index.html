<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia 2D - Mundo Definitivo</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 18px; margin: 6px 0; }
        .game-panel {
            max-width: 380px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #ffcb05;
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
        }
        p { margin: 4px 0; font-size: 13px; }
        .exp-bar-bg { width: 100%; background: #444; height: 10px; border-radius: 5px; overflow: hidden; margin: 4px 0; }
        .exp-bar-fill { height: 100%; background: #3b4cca; width: 0%; transition: width 0.3s; }
        #game-container { 
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffcb05; 
            border-radius: 6px; 
            overflow: hidden; 
            margin: 5px auto;
            width: 360px;
            height: 200px;
            background: #2d4d2d;
        }
        .dpad-container {
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-row { display: flex; }
        .dpad-btn, .action-btn {
            background: #e3350d;
            color: white;
            font-weight: bold;
            border: 2px solid #ffcb05;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .dpad-btn { width: 50px; height: 50px; font-size: 18px; margin: 3px; }
        .action-btn { width: 100%; padding: 8px; margin-top: 5px; font-size: 13px; background: #28a745; }
        .action-btn:hover { background: #1e7e34; }
        .dpad-btn:active, .action-btn:active { background: #b32305; }
    </style>
</head>
<body>

    <div class="game-panel">
        <h1>PokeTibia 2D World</h1>
        <p>Entrenador Nivel <span id="player-level">1</span> | Ruta: <b id="route-name">Ruta 1 (Césped)</b></p>
        <p>EXP: <span id="player-exp">0</span> / <span id="player-max-exp">100</span></p>
        <div class="exp-bar-bg"><div id="exp-fill" class="exp-bar-fill"></div></div>
        
        <!-- CONTENEDOR DEL JUEGO VISIBLE -->
        <div id="game-container"></div>

        <p id="battle-log">¡Camina por el césped para encontrar Pokémon!</p>
        
        <button class="action-btn" onclick="triggerAttack()">⚡ Usar Ataque Principal</button>
        <button class="action-btn" style="background:#3b4cca;" onclick="changeRoute()">🗺️ Cambiar de Ruta</button>

        <!-- CONTROLES TÁCTILES -->
        <div class="dpad-container">
            <button class="dpad-btn" id="btn-up">⬆️</button>
            <div class="dpad-row">
                <button class="dpad-btn" id="btn-left">⬅️</button>
                <button class="dpad-btn" id="btn-down">⬇️</button>
                <button class="dpad-btn" id="btn-right">➡️</button>
            </div>
        </div>
    </div>

    <script>
        let playerData = {
            level: 1,
            exp: 0,
            maxExp: 100,
            routeIndex: 0
        };

        const routes = [
            { name: "Ruta 1 (Césped)", bg: 0x2d4d2d },
            { name: "Bosque Verde", bg: 0x1b3b1b },
            { name: "Cueva Oscura", bg: 0x333333 }
        ];

        const config = {
            type: Phaser.AUTO,
            width: 360,
            height: 200,
            parent: 'game-container',
            backgroundColor: '#2d4d2d',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player;
        let cursors;
        let moveState = { left: false, right: false, up: false, down: false };
        let isMoving = false;

        function preload() {
            this.load.image('player', 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png');
        }

        function create() {
            player = this.physics.add.sprite(180, 100, 'player');
            player.setCollideWorldBounds(true);
            player.setScale(1.1);

            cursors = this.input.keyboard.createCursorKeys();

            setupDpadButton('btn-left', 'left');
            setupDpadButton('btn-right', 'right');
            setupDpadButton('btn-up', 'up');
            setupDpadButton('btn-down', 'down');
        }

        function setupDpadButton(id, direction) {
            let btn = document.getElementById(id);
            if(!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[direction] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[direction] = false; });
            btn.addEventListener('mousedown', () => { moveState[direction] = true; });
            btn.addEventListener('mouseup', () => { moveState[direction] = false; });
        }

        function update() {
            if (!player) return;
            player.setVelocity(0);
            let speed = 120;
            isMoving = false;

            if (cursors.left.isDown || moveState.left) { player.setVelocityX(-speed); isMoving = true; }
            else if (cursors.right.isDown || moveState.right) { player.setVelocityX(speed); isMoving = true; }

            if (cursors.up.isDown || moveState.up) { player.setVelocityY(-speed); isMoving = true; }
            else if (cursors.down.isDown || moveState.down) { player.setVelocityY(speed); isMoving = true; }

            if (isMoving && Math.random() < 0.015) {
                encounterPokemon();
            }
        }

        function encounterPokemon() {
            let pokes = ["Rattata", "Pidgey", "Caterpie", "Bulbasaur"];
            let wildPoke = pokes[Math.floor(Math.random() * pokes.length)];
            document.getElementById('battle-log').innerText = `⚔️ ¡Un ${wildPoke} salvaje apareció!`;
        }

        function triggerAttack() {
            document.getElementById('battle-log').innerText = `💥 ¡Atacaste! Ganaste 35 EXP.`;
            playerData.exp += 35;
            if (playerData.exp >= playerData.maxExp) {
                playerData.exp -= playerData.maxExp;
                playerData.level++;
                playerData.maxExp = Math.floor(playerData.maxExp * 1.3);
                alert(`🎉 ¡Subiste al Nivel ${playerData.level}!`);
            }
            updateUI();
        }

        function changeRoute() {
            playerData.routeIndex = (playerData.routeIndex + 1) % routes.length;
            let currentRoute = routes[playerData.routeIndex];
            document.getElementById('route-name').innerText = currentRoute.name;
            if (game.scene.scenes[0]) {
                game.scene.scenes[0].cameras.main.setBackgroundColor(currentRoute.bg);
            }
            document.getElementById('battle-log').innerText = `📍 Viajaste a ${currentRoute.name}.`;
        }

        function updateUI() {
            document.getElementById('player-level').innerText = playerData.level;
            document.getElementById('player-exp').innerText = playerData.exp;
            document.getElementById('player-max-exp').innerText = playerData.maxExp;
            let fillPercent = (playerData.exp / playerData.maxExp) * 100;
            document.getElementById('exp-fill').style.width = `${Math.min(100, fillPercent)}%`;
        }

        updateUI();
    </script>
</body>
</html>

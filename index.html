<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia 2D World</title>
    <!-- Cargamos el motor gratuito Phaser.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 20px; margin: 10px 0; }
        #game-container { 
            display: inline-block; 
            border: 3px solid #ffcb05; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 0 15px rgba(255, 203, 5, 0.3);
        }
        .controls-hint { font-size: 13px; color: #aaa; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>PokeTibia 2D World</h1>
    <div id="game-container"></div>
    <div class="controls-hint">Usa las flechas del teclado para moverte por el mapa</div>

    <script>
        // Configuración principal del motor Phaser
        const config = {
            type: Phaser.AUTO,
            width: 400,
            height: 300,
            parent: 'game-container',
            backgroundColor: '#2d4d2d', // Color verde estilo césped temporal
            physics: {
                default: 'arcade',
                arcade: { 
                    gravity: { y: 0 }, 
                    debug: false 
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player;
        let cursors;

        function preload() {
            // Usamos un sprite temporal gratuito de la PokeAPI para tu personaje (ej. Pikachu o Entrenador)
            this.load.image('player', 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png');
        }

        function create() {
            // Creamos al jugador en el centro del mapa
            player = this.physics.add.sprite(200, 150, 'player');
            player.setCollideWorldBounds(true);
            player.setScale(1.2);

            // Activamos los cursores del teclado
            cursors = this.input.keyboard.createCursorKeys();
        }

        function update() {
            // Reiniciar velocidad en cada fotograma
            player.setVelocity(0);

            // Movimiento direccional fluido
            if (cursors.left.isDown) {
                player.setVelocityX(-140);
            } else if (cursors.right.isDown) {
                player.setVelocityX(140);
            }

            if (cursors.up.isDown) {
                player.setVelocityY(-140);
            } else if (cursors.down.isDown) {
                player.setVelocityY(140);
            }
        }
    </script>
</body>
</html>

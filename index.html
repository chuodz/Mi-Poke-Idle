<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia 2D MMORPG - Sprites Reales</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 16px; margin: 4px 0; }
        .game-panel {
            max-width: 390px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #ffcb05;
            border-radius: 8px;
            padding: 6px;
            box-sizing: border-box;
        }
        p { margin: 3px 0; font-size: 11px; }
        .bar-bg { width: 100%; background: #444; height: 7px; border-radius: 4px; overflow: hidden; margin: 2px 0; }
        .bar-fill { height: 100%; background: #3b4cca; width: 0%; transition: width 0.3s; }
        .hp-fill { background: #28a745; }
        
        #game-container { 
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffcb05; 
            border-radius: 6px; 
            overflow: hidden; 
            margin: 4px auto;
            width: 360px;
            height: 190px;
            background: #2d4d2d;
        }

        .team-bar {
            display: flex;
            justify-content: space-around;
            background: #2a2a2a;
            border-radius: 6px;
            padding: 4px;
            margin: 4px 0;
        }
        .poke-slot {
            width: 31%;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 3px;
            cursor: pointer;
            font-size: 10px;
        }
        .poke-slot.active { border-color: #ffcb05; background: #443c15; }
        .poke-slot img { width: 26px; height: 26px; display: block; margin: 0 auto; }

        .dpad-container {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-row { display: flex; }
        .dpad-btn, .action-btn {
            background: #e3350d;
            color: white;
            font-weight: bold;
            border: 2px solid #ffcb05;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }
        .dpad-btn { width: 40px; height: 40px; font-size: 14px; margin: 2px; }
        .action-btn { width: 31%; padding: 5px; margin-top: 3px; font-size: 10px; display: inline-block; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #3b4cca; }
        .btn-orange { background: #d97706; }

        .box-section {
            background: #2a2a2a;
            border: 1px solid #ffcb05;
            border-radius: 6px;
            padding: 5px;
            margin-top: 4px;
            font-size: 11px;
            text-align: left;
            max-height: 110px;
            overflow-y: auto;
        }
        .shop-btn { padding: 2px 6px; font-size: 10px; background: #ffcb05; color: #000; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; float: right; }
    </style>
</head>
<body>

    <div class="game-panel">
        <h1>PokeTibia MMORPG Ultimate</h1>
        <p>Balls: <b id="pokeballs">5</b> | Dollars: $<span id="coins">40</span> | <span id="depot-status" style="color:#28a745;">Depot: Seguro</span></p>

        <!-- EQUIPO ACTIVO -->
        <p style="text-align:left; margin:2px 0;"><b>Tu Equipo Activo:</b></p>
        <div id="team-container" class="team-bar"></div>
        
        <!-- CONTENEDOR DEL JUEGO -->
        <div id="game-container"></div>

        <p id="battle-log">¡Explora los caminos y caza en el césped alto!</p>
        
        <!-- BARRA DE ATAQUES Y HECHIZOS -->
        <div>
            <button class="action-btn btn-green" onclick="castSpell('fast')">⚡ Ataque Rápido</button>
            <button class="action-btn btn-orange" onclick="castSpell('heavy')">🔥 Rayo Fuerte</button>
            <button class="action-btn btn-blue" onclick="tryCatch()">🔴 Pokéball</button>
        </div>
        <button class="action-btn btn-blue" style="width:100%; margin-top:3px;" onclick="changeRoute()">🗺️ Cambiar Mapa (<span id="zone-name">Ruta 1 - Pradera</span>)</button>

        <!-- D-PAD TÁCTIL -->
        <div class="dpad-container">
            <button class="dpad-btn" id="btn-up">⬆️</button>
            <div class="dpad-row">
                <button class="dpad-btn" id="btn-left">⬅️</button>
                <button class="dpad-btn" id="btn-down">⬇️</button>
                <button class="dpad-btn" id="btn-right">➡️</button>
            </div>
        </div>

        <!-- POKÉDEX Y COLECCIÓN -->
        <div class="box-section">
            <b>📖 Pokédex & Caja de Colección:</b>
            <div id="pokedex-list" style="margin-top:2px;">Cargando...</div>
        </div>

        <!-- TIENDA E INVENTARIO -->
        <div class="box-section">
            <b>🎒 Loot:</b> <span id="inventory-list">Vacío</span><br>
            <hr style="border-color:#444; margin:2px 0;">
            <span>🏥 Curar en Centro Pokémon ($15)</span><button class="shop-btn" onclick="healTeam()">Curar</button><br>
            <div style="margin-top:2px;"><span>🔴 Comprar Pokéball ($10)</span><button class="shop-btn" onclick="buyBall()">Comprar</button></div>
            <div style="margin-top:2px;"><span>💰 Vender Loot</span><button class="shop-btn" onclick="sellLoot()">Vender</button></div>
        </div>
    </div>

    <script>
        let playerData = {
            coins: 40,
            pokeballs: 5,
            routeIndex: 0,
            inventory: {},
            team: [
                { id: 25, name: "Pikachu", level: 5, exp: 0, maxExp: 100, hp: 60, maxHp: 60, atk: 25, evoId: 26, evoName: "Raichu" }
            ],
            activePokeIndex: 0,
            pokedex: {},
            box: []
        };

        const routes = [
            { name: "Ruta 1 - Pradera", bg: 0x2e5a1c, treeColor: 0x143308, grassColor: 0x3d7a25, pathColor: 0x8b5a2b },
            { name: "Bosque Verde", bg: 0x183b0d, treeColor: 0x0a1a05, grassColor: 0x245413, pathColor: 0x5c3a1e },
            { name: "Cueva Oscura", bg: 0x222222, treeColor: 0x111111, grassColor: 0x444444, pathColor: 0x666666 }
        ];

        const allPokemonSpecies = [
            { id: 10, name: "Caterpie", hp: 40, loot: 'Seda', price: 8 },
            { id: 16, name: "Pidgey", hp: 50, loot: 'Pluma', price: 12 },
            { id: 19, name: "Rattata", hp: 45, loot: 'Colmillo', price: 10 },
            { id: 25, name: "Pikachu", hp: 60, loot: 'Baya', price: 15 },
            { id: 4, name: "Charmander", hp: 55, loot: 'Escama', price: 20 },
            { id: 7, name: "Squirtle", hp: 65, loot: 'Caparazón', price: 20 }
        ];

        let activeEnemy = null;
        let enemySprite = null;
        let enemyHpBar = null;
        let lastAttackTime = 0;

        const config = {
            type: Phaser.AUTO,
            width: 360,
            height: 190,
            parent: 'game-container',
            backgroundColor: routes[0].bg,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let sceneContext;
        let trainer;
        let petPokemon;
        let cursors;
        let moveState = { left: false, right: false, up: false, down: false };

        function preload() {
            // Precargar los sprites oficiales a color de la PokeAPI para todas las especies
            allPokemonSpecies.forEach(p => {
                this.load.image(`poke${p.id}`, `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`);
            });
            this.load.image('poke26', 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/26.png');
        }

        function create() {
            sceneContext = this;

            createTrainerTexture(this);

            // Dibujar Decoración del Mapa
            drawMap(this, routes[0]);

            // Entrenador Humano
            trainer = this.physics.add.sprite(90, 95, 'trainer_gfx');
            trainer.setCollideWorldBounds(true);

            // Pokémon Acompañante con su sprite oficial
            let activePoke = playerData.team[playerData.activePokeIndex];
            petPokemon = this.physics.add.sprite(65, 95, `poke${activePoke.id}`);
            petPokemon.setScale(1.1);

            cursors = this.input.keyboard.createCursorKeys();

            setupDpadButton('btn-left', 'left');
            setupDpadButton('btn-right', 'right');
            setupDpadButton('btn-up', 'up');
            setupDpadButton('btn-down', 'down');

            spawnEnemyInMap(this);
            updateUI();
        }

        function createTrainerTexture(scene) {
            if (scene.textures.exists('trainer_gfx')) return;
            let g = scene.add.graphics();
            g.fillStyle(0x3366cc, 1); g.fillRect(6, 12, 12, 12);
            g.fillStyle(0x333333, 1); g.fillRect(7, 24, 10, 8);
            g.fillStyle(0xffcc99, 1); g.fillCircle(12, 8, 6);
            g.fillStyle(0xcc0000, 1); g.fillRect(6, 2, 12, 4);
            g.generateTexture('trainer_gfx', 24, 32);
            g.destroy();
        }

        function drawMap(scene, route) {
            let graphics = scene.add.graphics();
            
            // Senderos de tierra
            graphics.fillStyle(route.pathColor, 1);
            graphics.fillRect(0, 80, 360, 30);
            graphics.fillRect(165, 0, 30, 190);

            // Parches de césped alto
            graphics.fillStyle(route.grassColor, 1);
            graphics.fillRect(25, 20, 80, 45);
            graphics.fillRect(240, 125, 80, 45);

            // Centro Pokémon / Depot en el mapa
            graphics.fillStyle(0xcc0000, 1);
            graphics.fillRect(290, 15, 55, 35);
            graphics.fillStyle(0xffffff, 1);
            graphics.fillRect(310, 25, 15, 15);

            // Bordes de Árboles
            graphics.fillStyle(route.treeColor, 1);
            for(let x = 12; x <= 348; x += 24) {
                graphics.fillCircle(x, 10, 14);
                graphics.fillCircle(x, 180, 14);
            }
            for(let y = 12; y <= 180; y += 24) {
                graphics.fillCircle(10, y, 14);
                graphics.fillCircle(350, y, 14);
            }
        }

        function spawnEnemyInMap(scene) {
            if (enemySprite) enemySprite.destroy();
            if (enemyHpBar) enemyHpBar.destroy();

            let randomPoke = allPokemonSpecies[Math.floor(Math.random() * allPokemonSpecies.length)];
            let randomX = Math.floor(Math.random() * 100) + 210;
            let randomY = Math.floor(Math.random() * 70) + 60;

            activeEnemy = { ...randomPoke, currentHp: randomPoke.hp, maxHp: randomPoke.hp };

            if (!playerData.pokedex[randomPoke.id]) {
                playerData.pokedex[randomPoke.id] = { name: randomPoke.name, id: randomPoke.id, seen: 1, caught: 0 };
            } else {
                playerData.pokedex[randomPoke.id].seen++;
            }

            // Usar sprite oficial a color del enemigo salvaje
            enemySprite = scene.physics.add.sprite(randomX, randomY, `poke${randomPoke.id}`);
            enemySprite.setScale(1.1);

            enemyHpBar = scene.add.graphics();
            updateEnemyHpBar();

            document.getElementById('battle-log').innerText = `⚔️ ¡Un ${activeEnemy.name} salvaje apareció en el mapa!`;
            updateUI();
        }

        function updateEnemyHpBar() {
            if (!enemyHpBar || !enemySprite || !activeEnemy) return;
            enemyHpBar.clear();
            enemyHpBar.fillStyle(0x000000, 0.7);
            enemyHpBar.fillRect(enemySprite.x - 18, enemySprite.y - 26, 36, 5);

            let pct = Math.max(0, activeEnemy.currentHp / activeEnemy.maxHp);
            enemyHpBar.fillStyle(pct > 0.4 ? 0x00ff00 : 0xff0000, 1);
            enemyHpBar.fillRect(enemySprite.x - 18, enemySprite.y - 26, 36 * pct, 5);
        }

        function setupDpadButton(id, direction) {
            let btn = document.getElementById(id);
            if(!btn) return;
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[direction] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[direction] = false; });
            btn.addEventListener('mousedown', () => { moveState[direction] = true; });
            btn.addEventListener('mouseup', () => { moveState[direction] = false; });
        }

        function update() {
            if (!trainer) return;
            trainer.setVelocity(0);
            let speed = 125;

            if (cursors.left.isDown || moveState.left) { trainer.setVelocityX(-speed); }
            else if (cursors.right.isDown || moveState.right) { trainer.setVelocityX(speed); }

            if (cursors.up.isDown || moveState.up) { trainer.setVelocityY(-speed); }
            else if (cursors.down.isDown || moveState.down) { trainer.setVelocityY(speed); }

            if (petPokemon && trainer) {
                petPokemon.x = Phaser.Math.Linear(petPokemon.x, trainer.x - 22, 0.1);
                petPokemon.y = Phaser.Math.Linear(petPokemon.y, trainer.y, 0.1);
            }

            if (trainer.x > 270 && trainer.y < 55) {
                document.getElementById('depot-status').innerText = "Depot: ¡En zona segura!";
            } else {
                document.getElementById('depot-status').innerText = "Depot: Explorando";
            }

            if (enemySprite && activeEnemy) {
                updateEnemyHpBar();
            }
        }

        function castSpell

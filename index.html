<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia MMO - Jugabilidad Activa</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 5px; text-align: center; }
        .top-bar { display: flex; justify-content: space-around; background: #222; padding: 8px; border-radius: 8px; border: 1px solid #444; font-size: 14px; }
        .team-slot { background: #333; padding: 6px; border-radius: 6px; width: 45%; border: 1px solid #555; }
        
        /* Contenedor del Juego / Mapa */
        #game-container { position: relative; width: 100%; max-width: 400px; height: 250px; background: #2e8b57; margin: 10px auto; border: 3px solid #ffcc00; border-radius: 8px; overflow: hidden; }
        #player { position: absolute; width: 30px; height: 30px; background: #ffcc00; border-radius: 50%; top: 110px; left: 185px; }
        
        /* Controles de Movimiento en Pantalla (para celular) */
        .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; justify-content: center; margin-bottom: 10px; }
        .ctrl-btn { background: #333; color: #ffcc00; border: 1px solid #555; padding: 15px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        .ctrl-btn:active { background: #555; }

        /* Botones de Menú Principal */
        .menu-buttons { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn-game { background: #ffcc00; color: #000; border: none; padding: 8px 12px; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* Modales */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e1e1e; width: 90%; max-width: 380px; padding: 15px; border-radius: 10px; border: 2px solid #ffcc00; z-index: 1000; box-shadow: 0 0 15px rgba(0,0,0,0.8); text-align: left; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 8px; }
        .close-btn { background: #d9534f; color: white; border: none; padding: 3px 8px; cursor: pointer; border-radius: 4px; }
        
        .item-row, .poke-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; margin-bottom: 6px; padding: 6px; border-radius: 5px; font-size: 13px; }
        .action-btn { background: #4cae4c; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
        .danger-btn { background: #d9534f; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
        
        #battle-box { display: none; background: rgba(0,0,0,0.9); position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR: EQUIPO ACTIVO -->
    <div class="top-bar">
        <div class="team-slot" id="slot-0">Cargando...</div>
        <div class="team-slot" id="slot-1">Cargando...</div>
    </div>

    <!-- ÁREA DE JUEGO / MAPA Y BATALLA -->
    <div id="game-container">
        <div id="player"></div>
        
        <!-- PANTALLA DE BATALLA / ENCUENTRO -->
        <div id="battle-box">
            <h3 id="wild-poke-title" style="color: #ffcc00;">¡Un Pokémon Salvaje apareció!</h3>
            <p id="battle-info">¿Qué deseas hacer?</p>
            <button class="action-btn" onclick="attackWildPokemon()">Atacar</button>
            <button class="btn-game" onclick="catchWildPokemon()">Lanzar Pokéball</button>
            <button class="danger-btn" onclick="fleeBattle()">Huir</button>
        </div>
    </div>

    <!-- CONTROLES DE MOVIMIENTO -->
    <div class="controls">
        <div></div>
        <button class="ctrl-btn" onclick="movePlayer('up')">⬆️</button>
        <div></div>
        <button class="ctrl-btn" onclick="movePlayer('left')">⬅️</button>
        <button class="ctrl-btn" onclick="movePlayer('down')">⬇️</button>
        <button class="ctrl-btn" onclick="movePlayer('right')">➡️</button>
    </div>

    <!-- BOTONES DE ACCIÓN RÁPIDA -->
    <div class="menu-buttons">
        <button class="btn-game" onclick="openModal('shopModal')">🛒 PokéMart</button>
        <button class="btn-game" onclick="openModal('inventoryModal')">🎒 Inventario</button>
        <button class="btn-game" onclick="openModal('pokedexModal')">📖 Pokédex</button>
    </div>

    <!-- VENTANA: POKÉMART -->
    <div id="shopModal" class="modal">
        <div class="modal-header">
            <h3>PokéMart</h3>
            <button class="close-btn" onclick="closeModal('shopModal')">X</button>
        </div>
        <p>Dinero: <span id="playerMoney">5300</span>$</p>
        <div class="item-row">
            <span>Pokéball ($10)</span>
            <button class="action-btn" onclick="buyItem('ball', 10, 'Pokéball')">Comprar</button>
        </div>
        <div class="item-row">
            <span>Poción HP ($15)</span>
            <button class="action-btn" onclick="buyItem('pot', 15, 'Poción de HP')">Comprar</button>
        </div>
        <hr>
        <button class="danger-btn" style="width:100%;" onclick="openWeakPokemonSell()">🤖 Vender Pokémon Débiles</button>
    </div>

    <!-- VENTANA: INVENTARIO -->
    <div id="inventoryModal" class="modal">
        <div class="modal-header">
            <h3>Inventario</h3>
            <button class="close-btn" onclick="closeModal('inventoryModal')">X</button>
        </div>
        <div id="inventoryList" style="max-height:200px; overflow-y:auto;"></div>
    </div>

    <!-- VENTANA: POKÉDEX -->
    <div id="pokedexModal" class="modal">
        <div class="modal-header">
            <h3>Pokédex y Caja</h3>
            <button class="close-btn" onclick="closeModal('pokedexModal')">X</button>
        </div>
        <div id="pokedexList" style="max-height:200px; overflow-y:auto;"></div>
    </div>

    <!-- VENTANA: VENTA DE POKÉMON DÉBILES -->
    <div id="weakPokemonModal" class="modal">
        <div class="modal-header">
            <h3>Vender Pokémon No Deseados</h3>
            <button class="close-btn" onclick="closeModal('weakPokemonModal')">X</button>
        </div>
        <p style="font-size:12px;">Se venden comunes ($20) y poco comunes ($50) sin proteger.</p>
        <button class="danger-btn" style="width:100%; padding:8px;" onclick="confirmSellWeakPokemon()">Vender Automáticamente</button>
    </div>

    <script>
        // --- ESTADO DEL JUEGO ---
        let game = {
            money: 5300,
            playerX: 185,
            playerY: 110,
            inBattle: false,
            currentWildPoke: null,
            team: [
                { name: "Pikachu", level: 50, rareza: "Místico", hp: 800, maxHp: 800, locked: true },
                { name: "Charmander", level: 6, rareza: "Común", hp: 360, maxHp: 360, locked: false }
            ],
            storage: [
                { name: "Caterpie", level: 4, rareza: "Común", hp: 120, maxHp: 120, locked: false }
            ],
            inventory: [
                { id: 'pot', name: 'Poción de HP', count: 5, type: 'heal', value: 15 },
                { id: 'ball', name: 'Pokéball', count: 12, type: 'item', value: 10 }
            ]
        };

        // --- MOVIMIENTO Y JUGABILIDAD EN EL MAPA ---
        function movePlayer(dir) {
            if (game.inBattle) return;
            
            if (dir === 'up') game.playerY = Math.max(0, game.playerY - 10);
            if (dir === 'down') game.playerY = Math.min(220, game.playerY + 10);
            if (dir === 'left') game.playerX = Math.max(0, game.playerX - 10);
            if (dir === 'right') game.playerX = Math.min(370, game.playerX + 10);

            document.getElementById('player').style.top = game.playerY + 'px';
            document.getElementById('player').style.left = game.playerX + 'px';

            // Probabilidad de encuentro salvaje al caminar (20% de probabilidad por paso)
            if (Math.random() < 0.2) {
                triggerWildEncounter();
            }
        }

        function triggerWildEncounter() {
            game.inBattle = true;
            let pokemons = [
                { name: "Pidgey", level: 3, rareza: "Común", hp: 100, maxHp: 100 },
                { name: "Rattata", level: 2, rareza: "Común", hp: 90, maxHp: 90 },
                { name: "Bulbasaur", level: 5, rareza: "Poco Común", hp: 150, maxHp: 150 }
            ];
            game.currentWildPoke = pokemons[Math.floor(Math.random() * pokemons.length)];
            
            document.getElementById('wild-poke-title').innerText = `¡Un ${game.currentWildPoke.name} Salvaje (Lv.${game.currentWildPoke.level}) apareció!`;
            document.getElementById('battle-info').innerText = `HP del rival: ${game.currentWildPoke.hp}/${game.currentWildPoke.maxHp}`;
            document.getElementById('battle-box').style.display = 'block';
        }

        function attackWildPokemon() {
            game.currentWildPoke.hp -= 50;
            if (game.currentWildPoke.hp <= 0) {
                alert(`¡Derrotaste al ${game.currentWildPoke.name} salvaje! Ganaste experiencia.`);
                closeBattle();
            } else {
                document.getElementById('battle-info').innerText = `¡Le diste un golpe! HP del rival: ${game.currentWildPoke.hp}/${game.currentWildPoke.maxHp}`;
            }
        }

        function catchWildPokemon() {
            let ballIndex = game.inventory.findIndex(i => i.id === 'ball');
            if (ballIndex !== -1 && game.inventory[ballIndex].count > 0) {
                game.inventory[ballIndex].count--;
                alert(`¡Atrapaste a ${game.currentWildPoke.name} con éxito y fue enviado a tu caja!`);
                game.storage.push({ ...game.currentWildPoke, locked: false });
                closeBattle();
            } else {
                alert("¡No tienes Pokéballs en tu inventario! Cómpralas en la tienda.");
            }
        }

        function fleeBattle() {
            alert("¡Lograste huir con éxito!");
            closeBattle();
        }

        function closeBattle() {
            game.inBattle = false;
            document.getElementById('battle-box').style.display = 'none';
        }

        // --- MODALES Y ACCIONES ---
        function openModal(id) { document.getElementById(id).style.display = 'block'; if(id==='inventoryModal')renderInventory(); if(id==='pokedexModal')renderPokedex(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function renderTeam() {
            for (let i = 0; i < 2; i++) {
                let slot = document.getElementById(`slot-${i}`);
                let p = game.team[i];
                if (p) slot.innerHTML = `<b>${p.name} (Lv.${p.level})</b><br>HP: ${p.hp}/${p.maxHp}`;
            }
            document.getElementById('playerMoney').innerText = game.money;
        }

        function renderInventory() {
            let c = document.getElementById('inventoryList');
            c.innerHTML = '';
            game.inventory.forEach((item, idx) => {
                c.innerHTML += `<div class="item-row"><span>${item.name} (x${item.count})</span><button class="action-btn" onclick="useItem(${idx})">Usar</button></div>`;
            });
        }

        function useItem(idx) {
            let item = game.inventory[idx];
            if (item.count > 0 && item.type === 'heal') {
                game.team[0].hp = Math.min(game.team[0].maxHp, game.team[0].hp + 100);
                item.count--;
                alert(`¡Usaste ${item.name}! Pikachu recuperó vida.`);
                renderTeam();
                renderInventory();
            } else {
                alert("Este ítem no se puede usar ahora o no quedan unidades.");
            }
        }

        function buyItem(id, price, name) {
            if (game.money >= price) {
                game.money -= price;
                let found = game.inventory.find(i => i.id === id);
                if (found) found.count++;
                else game.inventory.push({ id, name, count: 1, type: id==='pot'?'heal':'item', value: price });
                renderTeam();
                alert(`¡Has comprado ${name}!`);
            } else {
                alert("No tienes suficiente dinero.");
            }
        }

        function renderPokedex() {
            let c = document.getElementById('pokedexList');
            c.innerHTML = '<b>Tu Caja de Pokémon:</b>';
            game.storage.forEach((p, i) => {
                let lockText = p.locked ? '🔒 Protegido' : '🔓 Proteger';
                c.innerHTML += `<div class="poke-row"><span>${p.name} (${p.rareza})</span><div><button class="action-btn" onclick="toggleLock(${i})">${lockText}</button></div></div>`;
            });
        }

        function toggleLock(i) {
            game.storage[i].locked = !game.storage[i].locked;
            renderPokedex();
        }

        function openWeakPokemonSell() { closeModal('shopModal'); openModal('weakPokemonModal'); }
        function confirmSellWeakPokemon() {
            let earnings = 0;
            let kept = [];
            game.storage.forEach(p => {
                if ((p.rareza === 'Común' || p.rareza === 'Poco Común') && !p.locked) {
                    earnings += (p.rareza === 'Común' ? 20 : 50);
                } else {
                    kept.push(p);
                }
            });
            game.storage = kept;
            game.money += earnings;
            renderTeam();
            closeModal('weakPokemonModal');
            alert(`¡Vendiste los Pokémon débiles por $${earnings}!`);
        }

        renderTeam();
    </script>
</body>
</html>

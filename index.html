<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTibia 2D World - Controles Móviles</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            text-align: center; 
            font-family: Arial, sans-serif; 
        }
        h1 { color: #ffcb05; font-size: 18px; margin: 8px 0; }
        #game-container { 
            display: inline-block; 
            border: 3px solid #ffcb05; 
            border-radius: 10px; 
            overflow: hidden; 
            box-shadow: 0 0 15px rgba(255, 203, 5, 0.3);
        }
        .dpad-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dpad-row {
            display: flex;
        }
        .dpad-btn {
            width: 60px;
            height: 60px;
            background: #e3350d;
            color: white;
            font-size: 20px;
            border: 2px solid #ffcb05;
            border-radius: 8px;
            margin: 4px;
            cursor: pointer;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
        }
        .dpad-btn:active {
            background: #b32305;
        }
    </style>
</head>
<body>

    <h1>PokeTibia 2D World</h1>
    <div id="game-container"></div>

    <!-- CONTROLES TÁCTILES EN PANTALLA -->
    <div class="dpad-container">
        <button class="dpad-btn" id="btn-up">⬆️</button>
        <div class="dpad-row">
            <button class="dpad-btn" id="btn-left">⬅️</button>
            <button class="dpad-btn" id="btn-down">⬇️</button>
            <button class="dpad-btn" id="btn-right">➡️</button>
        </div>
    </div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 380,
            height: 260,
            parent: 'game-container',
            backgroundColor: '#2d4d2d',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 }, debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player;
        let cursors;
        let moveState = { left: false, right: false, up: false, down: false };

        function preload() {
            this.load.image('player', 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png');
        }

        function create() {
            player = this.physics.add.sprite(190, 130, 'player');
            player.setCollideWorldBounds(true);
            player.setScale(1.2);

            cursors = this.input.keyboard.createCursorKeys();

            // Configurar eventos táctiles para los botones en pantalla
            setupDpadButton('btn-left', 'left');
            setupDpadButton('btn-right', 'right');
            setupDpadButton('btn-up', 'up');
            setupDpadButton('btn-down', 'down');
        }

        function setupDpadButton(id, direction) {
            let btn = document.getElementById(id);
            
            // Táctil (Móvil)
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[direction] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[direction] = false; });
            
            // Ratón (PC)
            btn.addEventListener('mousedown', () => { moveState[direction] = true; });
            btn.addEventListener('mouseup', () => { moveState[direction] = false; });
            btn.addEventListener('mouseleave', () => { moveState[direction] = false; });
        }

        function update() {
            player.setVelocity(0);

            let speed = 140;

            if (cursors.left.isDown || moveState.left) {
                player.setVelocityX(-speed);
            } else if (cursors.right.isDown || moveState.right) {
                player.setVelocityX(speed);
            }

            if (cursors.up.isDown || moveState.up) {
                player.setVelocityY(-speed);
            } else if (cursors.down.isDown || moveState.down) {
                player.setVelocityY(speed);
            }
        }
    </script>
</body>
</html>
